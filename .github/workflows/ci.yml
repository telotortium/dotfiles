name: CI

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies (ShellCheck, Bats, Zsh)
        run: |
          sudo apt-get update -y
          sudo apt-get install -y shellcheck bats zsh

      - name: ShellCheck
        run: |
          shellcheck \
            .bashrc \
            .terminal-background.bash \
            .common.sh

      - name: Zsh syntax
        # ShellCheck does not support Zsh; check it with its own parser.
        run: zsh -n .zshrc

      - name: Run Bats tests
        run: |
          bats -r test
